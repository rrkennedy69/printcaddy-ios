name: Build unsigned iPad IPA
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/checkout@v4
        with: { repository: rrkennedy69/rrkennedy69.github.io, path: site }
      - run: npm install
      - name: Build www from the live site
        run: scripts/make-www.sh site && rm -rf site
      - name: Add iOS platform
        run: |
          npx cap add ios || true   # pod install can fail here until the deployment target is raised
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios
      - name: Configure app (name, icon, orientations, iPad, files)
        run: |
          P=ios/App/App/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Set :CFBundleDisplayName PrintCaddy" $P || $B -c "Add :CFBundleDisplayName string PrintCaddy" $P
          for k in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            $B -c "Delete :$k" $P || true
            $B -c "Add :$k array" $P
            i=0; for o in UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight; do $B -c "Add :$k:$i string $o" $P; i=$((i+1)); done
          done
          $B -c "Add :UIFileSharingEnabled bool true" $P || true
          $B -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $P || true
          $B -c "Add :UIRequiresFullScreen bool false" $P || true
          $B -c "Delete :CFBundleURLTypes" $P || true
          $B -c "Add :CFBundleURLTypes array" $P
          $B -c "Add :CFBundleURLTypes:0 dict" $P
          $B -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.rrkennedy.printcaddy" $P
          $B -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" $P
          $B -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string printcaddy" $P
          ICON=$(ls ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png | head -1)
          cp resources/icon-1024.png "$ICON"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = .*;/TARGETED_DEVICE_FAMILY = "1,2";/' ios/App/App.xcodeproj/project.pbxproj
          grep -n "TARGETED_DEVICE_FAMILY\|PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj
      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath $PWD/build/App.xcarchive \
            archive MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app out/Payload/PrintCaddy.app
          cd out && zip -qry PrintCaddy.ipa Payload && ls -la PrintCaddy.ipa
      - uses: actions/upload-artifact@v4
        with: { name: PrintCaddy-ipa, path: out/PrintCaddy.ipa }
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=build-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}
          V=1.0.${{ github.run_number }}
          SIZE=$(stat -f%z out/PrintCaddy.ipa)
          WEB=$(python3 -c 'import json;print(json.load(open("www/version.json"))["build"])')
          python3 scripts/altstore.py "$TAG" "$V" "$SIZE" "$WEB" > out/apps.json
          gh release create "$TAG" out/PrintCaddy.ipa out/apps.json --title "PrintCaddy iPad $V ($TAG)" --notes "Unsigned IPA for AltStore sideloading. App $V, web build $WEB. The app updates its web part in-app; install a new .ipa only for native changes." --latest
      - name: Publish web bundle for in-app updates
        env: { GH_TOKEN: "${{ github.token }}" }
        run: scripts/publish-web.sh
