name: Publish web bundle (in-app updates)
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: web-bundle, cancel-in-progress: false }
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: rrkennedy69/rrkennedy69.github.io, path: site }
      - run: scripts/make-www.sh site
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: scripts/publish-web.sh
